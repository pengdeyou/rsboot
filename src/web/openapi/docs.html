<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rsboot API 文档</title>
<style>
  :root {
    --bg: #fbfbfd; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea;
    --card: #fff; --accent: #0b6cf0;
    --get: #0b8a3e; --post: #0b6cf0; --put: #a15c00; --patch: #7b3fe4; --delete: #c4161c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111114; --fg:#f2f2f4; --muted:#98989f; --line:#2c2c31; --card:#1a1a1f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:28px 20px 80px; background:var(--bg); color:var(--fg);
         font:14px/1.6 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .tag { margin: 28px 0 10px; font-size: 13px; font-weight: 600; color: var(--muted);
         text-transform: uppercase; letter-spacing: .06em; }
  .route { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
           margin-bottom: 8px; overflow: hidden; }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .row:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .m { flex: 0 0 62px; font: 600 11px/1 ui-monospace, Menlo, monospace; text-align: center;
       padding: 6px 0; border-radius: 5px; color: #fff; letter-spacing: .04em; }
  .m.get { background: var(--get); } .m.post { background: var(--post); }
  .m.put { background: var(--put); } .m.patch { background: var(--patch); }
  .m.delete { background: var(--delete); }
  .path { font: 500 13.5px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; }
  .sum { color: var(--muted); font-size: 13px; }
  .body { display: none; padding: 4px 14px 16px; border-top: 1px solid var(--line); }
  .body.open { display: block; }
  h4 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .05em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  code, pre { font: 12.5px/1.5 ui-monospace, Menlo, monospace; }
  pre { background: color-mix(in srgb, var(--fg) 6%, transparent); padding: 10px 12px;
        border-radius: 8px; overflow: auto; max-height: 320px; margin: 0; }
  .req { display: grid; grid-template-columns: 160px 1fr; gap: 6px 10px; align-items: center; }
  .req label { font-size: 12.5px; color: var(--muted); }
  input, textarea { width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font: inherit; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; min-height: 96px; }
  button { margin-top: 12px; background: var(--accent); color: #fff; border: 0;
           border-radius: 8px; padding: 8px 16px; font: 600 13px/1 inherit; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  .out { margin-top: 12px; display: none; }
  .out.show { display: block; }
  .status { font: 600 13px/1 ui-monospace, Menlo, monospace; margin-bottom: 6px; }
  .ok { color: var(--get); } .bad { color: var(--delete); }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">API 文档</h1>
    <div class="sub" id="meta"></div>
    <div class="sub">点任意一条展开；参数与请求体可直接试跑（同源请求，无需配置 CORS）。</div>
  </header>
  <div id="list"></div>
</main>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let spec = null;

function schemaHint(s) {
  if (!s) return '';
  if (s.$ref) return s.$ref.replace('#/components/schemas/', '');
  if (Array.isArray(s.type)) return s.type.join(' | ');
  if (s.type === 'array') return 'array&lt;' + schemaHint(s.items) + '&gt;';
  if (s.enum) return 'enum(' + s.enum.map(esc).join(', ') + ')';
  return esc(s.type || (s.anyOf ? 'any' : 'object'));
}

function paramsTable(params) {
  if (!params || !params.length) return '';
  const rows = params.map(p => `<tr>
      <td><code>${esc(p.name)}</code></td>
      <td>${esc(p.in)}</td>
      <td>${p.required ? '是' : ''}</td>
      <td>${schemaHint(p.schema)}</td>
      <td>${esc(p.description || '')}</td>
    </tr>`).join('');
  return `<h4>参数</h4><table><tr><th>名称</th><th>位置</th><th>必填</th><th>类型</th><th>说明</th></tr>${rows}</table>`;
}

function responsesTable(resp) {
  if (!resp) return '';
  const rows = Object.entries(resp).map(([code, r]) =>
    `<tr><td><code>${esc(code)}</code></td><td>${esc(r.description || '')}</td>
     <td>${r.content ? schemaHint(r.content['application/json']?.schema) : ''}</td></tr>`).join('');
  return `<h4>响应</h4><table><tr><th>状态</th><th>说明</th><th>结构</th></tr>${rows}</table>`;
}

function tryForm(path, op) {
  const params = op.parameters || [];
  const pathParams = params.filter(p => p.in === 'path');
  const queryParams = params.filter(p => p.in === 'query');
  const body = op.requestBody;

  let fields = '';
  pathParams.forEach(p => {
    fields += `<label>${esc(p.name)} (path)</label>
      <input data-path="${esc(p.name)}" placeholder="${schemaHint(p.schema)}">`;
  });
  queryParams.forEach(p => {
    fields += `<label>${esc(p.name)}${p.required ? ' *' : ''} (query)</label>
      <input data-query="${esc(p.name)}" placeholder="${schemaHint(p.schema)}">`;
  });

  let bodyBox = '';
  if (body) {
    const schema = body.content?.['application/json']?.schema || {};
    bodyBox = `<label>请求体 JSON</label><textarea data-body>${esc(JSON.stringify(sample(schema), null, 2))}</textarea>`;
  }

  return `<h4>试跑</h4>
    <div class="req">${fields}${bodyBox}</div>
    <button data-run>发送请求</button>
    <div class="out"><div class="status"></div><pre class="body"></pre></div>`;
}

// 从 schema 造一个最小示例，省得使用者从空白开始猜字段
function sample(s) {
  if (!s || !s.type) return {};
  if (Array.isArray(s.type)) return sample({ type: s.type.find(t => t !== 'null') || 'string', properties: s.properties, items: s.items });
  if (s.enum) return s.enum[0];
  switch (s.type) {
    case 'string': return s.format === 'date-time' ? '2026-01-01T00:00:00Z' : '';
    case 'integer': case 'number': return 0;
    case 'boolean': return false;
    case 'array': return [sample(s.items)];
    case 'object': {
      const out = {};
      Object.entries(s.properties || {}).forEach(([k, v]) => { out[k] = sample(v); });
      return out;
    }
    default: return null;
  }
}

async function run(btn, path, method, op) {
  const box = btn.parentElement;
  const out = box.querySelector('.out');
  const statusEl = box.querySelector('.status');
  const pre = box.querySelector('pre.body');

  let url = path;
  box.querySelectorAll('[data-path]').forEach(i => {
    if (i.value) url = url.replace('{' + i.dataset.path + '}', encodeURIComponent(i.value));
  });
  const qs = [];
  box.querySelectorAll('[data-query]').forEach(i => {
    if (i.value) qs.push(encodeURIComponent(i.dataset.query) + '=' + encodeURIComponent(i.value));
  });
  if (qs.length) url += '?' + qs.join('&');

  const init = { method, headers: {} };
  const ta = box.querySelector('[data-body]');
  if (ta && ta.value.trim()) {
    init.headers['content-type'] = 'application/json';
    init.body = ta.value;
  }

  out.classList.add('show');
  statusEl.textContent = '请求中…';
  statusEl.className = 'status';
  const t0 = performance.now();
  try {
    const res = await fetch(url, init);
    const ms = Math.round(performance.now() - t0);
    const text = await res.text();
    statusEl.textContent = `${res.status} ${res.statusText} · ${ms}ms · ${res.headers.get('content-type') || ''}`;
    statusEl.className = 'status ' + (res.ok ? 'ok' : 'bad');
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    pre.textContent = pretty || '(空响应体)';
  } catch (e) {
    statusEl.textContent = '请求失败：' + e;
    statusEl.className = 'status bad';
    pre.textContent = '';
  }
}

function render() {
  document.getElementById('title').textContent = spec.info?.title || 'API';
  document.getElementById('meta').textContent =
    `OpenAPI ${spec.openapi} · ${Object.keys(spec.paths || {}).length} 个路径`;

  const groups = new Map();
  for (const [path, item] of Object.entries(spec.paths || {})) {
    for (const [method, op] of Object.entries(item)) {
      const tag = (op.tags && op.tags[0]) || '默认';
      if (!groups.has(tag)) groups.set(tag, []);
      groups.get(tag).push({ path, method, op });
    }
  }

  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const [tag, items] of groups) {
    const h = document.createElement('div');
    h.className = 'tag';
    h.textContent = tag;
    list.appendChild(h);

    items.forEach(({ path, method, op }) => {
      const card = document.createElement('div');
      card.className = 'route';
      const hasDoc = op.summary && !op.summary.startsWith(method.toUpperCase() + ' /');
      card.innerHTML = `
        <div class="row">
          <span class="m ${method}">${method.toUpperCase()}</span>
          <span class="path">${esc(path)}</span>
          <span class="sum">${hasDoc ? esc(op.summary) : '<i class="empty">未写文档</i>'}</span>
        </div>
        <div class="body">
          ${op.description ? `<p class="sub">${esc(op.description)}</p>` : ''}
          ${paramsTable(op.parameters)}
          ${replyBody(op)}
          ${responsesTable(op.responses)}
          ${tryForm(path, op)}
        </div>`;
      card.querySelector('.row').addEventListener('click', () => {
        card.querySelector('.body').classList.toggle('open');
      });
      const btn = card.querySelector('[data-run]');
      if (btn) btn.addEventListener('click', () => run(btn, path, method.toUpperCase(), op));
      list.appendChild(card);
    });
  }
  if (!groups.size) list.innerHTML = '<p class="empty">这份文档里还没有路由。</p>';
}

function replyBody(op) {
  const s = op.requestBody?.content?.['application/json']?.schema;
  return s ? `<h4>请求体结构</h4><pre>${esc(JSON.stringify(s, null, 2))}</pre>` : '';
}

fetch('openapi.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(j => { spec = j; render(); })
  .catch(e => {
    document.getElementById('list').innerHTML =
      `<p class="empty">读取 openapi.json 失败：${esc(e.message)}。请确认 \`http.docs\` 已开启。</p>`;
  });
</script>
</body>
</html>
