[package]
name = "rsboot-claw"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "A zero-dependency web crawler for rsboot: frontier, dedup, robots.txt, rate limit."
repository = "https://github.com/pengdeyou/rsboot"

# 库本体零依赖：URL 解析、HTML 扫描、robots、去重、HTTP 客户端、cookie、
# 以及 TLS 1.3 的整套密码学（SHA-256/HKDF、ChaCha20-Poly1305、AES-GCM、
# x25519、P-256、X.509）全部在仓库内手写，一个 `[dependencies]` 都不需要。

[dev-dependencies]
rsboot = { path = "../.." }
