[package]
name = "rsboot"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
description = "A FastAPI-style application framework for rsbatis: declarative routes, typed path/query/body extraction, automatic OpenAPI docs and Swagger UI. Self-hosted HTTP/1.1 stack (no axum/hyper)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pengdeyou/rsboot"
keywords = ["orm", "web", "framework", "fastapi", "openapi"]
categories = ["web-programming::http-server", "database"]
readme = "README.md"
documentation = "https://docs.rs/rsboot"

[features]
default = []
# 线程缓存的 size-class 分配器。打开后 `#[global_allocator]` 会被换成自研实现，
# 影响整个链接进来的程序（包括下游自己的分配），所以不默认开。
tc-alloc = []
# 分阶段计时探针。默认关：探针本身每请求十几次原子读，并且会把 rdtsc / Instant
# 调用留在热路径上（实测开着的构建比关掉的慢 1.6%，20 轮 15:5）。
# 要排查时用 `cargo build --features prof`，并且仍然要 RSBOOT_PROFILE=1 才真的计时。
prof = []

[dependencies]
rsbatis = { version = "0.1.0-alpha.29", path = "../rsbatis/crates/rsbatis", features = ["sqlite", "mysql", "migrate"] }
# JSON 是 Web 框架的必需品，serde 生态无法替代
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 从类型生成 JSON Schema，OpenAPI 自动文档靠它（FastAPI 靠 pydantic 做同一件事）
# 查询串反序列化。引它而不是手搓：重复键、% 编码、`+` 当空格这些细节
# 自己实现必然出错，而它只有几十行代码
serde_urlencoded = "0.7"
# 从 Rust 类型生成 JSON Schema（`JsonSchema` derive）。OpenAPI 的 request/response
# 结构靠它——Rust 没有运行时反射，FastAPI 靠 pydantic 做的是同一件事
schemars = "1"

# 扩展模块是独立子 crate：cookie / form / 运维端点。核心保持零额外依赖，
# 不用这些功能的人连编译都省了。
[workspace]
members = ["crates/rsboot-ops", "crates/rsboot-cookie", "crates/rsboot-form", "crates/rsboot-static", "crates/rsboot-view"]
