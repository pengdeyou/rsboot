[package]
name = "rsboot"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
description = "A FastAPI-style application framework for rsbatis: declarative routes, typed path/query/body extraction, automatic OpenAPI docs and Swagger UI. Self-hosted HTTP/1.1 stack (no axum/hyper)."
license = "MIT OR Apache-2.0"
keywords = ["orm", "web", "framework", "fastapi", "openapi"]
categories = ["web-programming::http-server", "database"]
readme = "README.md"
documentation = "https://docs.rs/rsboot"

[dependencies]
rsbatis = { version = "0.1.0-alpha.29", path = "../rsbatis", features = ["sqlite", "mysql", "migrate"] }
# JSON 是 Web 框架的必需品，serde 生态无法替代
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 从类型生成 JSON Schema，OpenAPI 自动文档靠它（FastAPI 靠 pydantic 做同一件事）
# 查询串反序列化。引它而不是手搓：重复键、% 编码、`+` 当空格这些细节
# 自己实现必然出错，而它只有几十行代码
serde_urlencoded = "0.7"
# 从 Rust 类型生成 JSON Schema（`JsonSchema` derive）。OpenAPI 的 request/response
# 结构靠它——Rust 没有运行时反射，FastAPI 靠 pydantic 做的是同一件事
schemars = "1"
